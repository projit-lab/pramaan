    Mandate:
      type: object
      description: |
        An AP2-style dual-signed record. The approver's phone and Cloud KMS sign DIFFERENT bytes:
        the phone signs the payment summary (summary_b64) with its hardware key; Cloud KMS
        countersigns the mandate (mandate_b64) which binds summary_sha256 and the phone's device public key.

        Verification order (must fail closed at any step):
          a. KMS countersignature over mandate_b64 (public key from GET /keys/countersign).
          b. Take the device public key ONLY from inside the decoded mandate_b64; ignore any key in the outer JSON.
          c. Approver signature (DER converted to raw r||s) over summary_b64 with that device key.
          d. SHA-256(summary_b64 bytes) must equal summary_sha256 inside mandate_b64.
          e. Expiry from inside mandate_b64.

        Display rule: Verifiers must parse and display payee, account, IFSC and amount from
        summary_b64 only; display decision, tier, device, and signed time from mandate_b64 only.
      required: [mandate_id, type, intent_id, summary_sha256, summary_b64, mandate_b64, decision, tier, approval, countersignature, expires_at]
      properties:
        mandate_id:
          type: string
        type:
          type: string
          const: pramaan.payment_mandate.v1
        intent_id:
          type: string
        summary_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        summary_b64:
          type: string
          description: |
            Base64 of the exact canonical payment summary bytes the approver's device signed
            (keys sorted, no whitespace, all values strings, NFC-normalised).
        mandate_b64:
          type: string
          description: |
            Base64 of the exact canonical mandate bytes Cloud KMS countersigned. The mandate
            contains summary_sha256, decision, tier, policy_version, device_id, the device
            public key (SPKI, base64), key_security_level, integrity verdict, the approver
            signature, signed_at and expires_at.
        decision:
          $ref: '#/components/schemas/Decision'
        tier:
          $ref: '#/components/schemas/Tier'
        policy_version:
          type: [string, 'null']
        payer:
          type: object
          properties:
            company:
              type: string
            account_last4:
              type: string
        payee:
          $ref: '#/components/schemas/Payee'
        amount_paise:
          $ref: '#/components/schemas/Paise'
        currency:
          type: string
          const: INR
        purpose:
          type: object
          properties:
            invoice:
              type: [string, 'null']
            invoice_sha256:
              type: [string, 'null']
        initiator:
          $ref: '#/components/schemas/Initiator'
        approval:
          type: object
          description: Owned by Prajit.
          required: [approver, decision, signed_at, signature]
          properties:
            approver:
              type: string
            decision:
              $ref: '#/components/schemas/Decision'
            signed_at:
              $ref: '#/components/schemas/Timestamp'
            device_id:
              type: [string, 'null']
            key_security_level:
              oneOf:
                - $ref: '#/components/schemas/KeySecurityLevel'
                - type: 'null'
            patch_level:
              type: [string, 'null']
            device_integrity:
              type: [string, 'null']
              description: |
                The Play Integrity verdict, only when the server really verified
                one. Null means no verdict, and the screen must say so rather than
                imply a passed check.
            public_key:
              type: [string, 'null']
              description: Approver device P-256 public key (SPKI PEM or base64 DER).
            signature:
              type: string
              description: Base64. Owned by Prajit.
        countersignature:
          type: object
          required: [kms_key_version, signature]
          properties:
            kms_key_version:
              type: string
            public_key:
              type: [string, 'null']
              description: KMS P-256 public key (SPKI PEM), if bundled.
            signature:
              type: string
              description: |
                Base64 of the DER signature from Cloud KMS. WebCrypto needs raw
                r||s (64 bytes), so the verifier page converts it first.
            algorithm:
              type: string
              const: EC_SIGN_P256_SHA256
        signed_at:
          type: [string, 'null']
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        used_at:
          type: [string, 'null']
          description: A mandate releases one payment only.
