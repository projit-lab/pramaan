[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pramaan-api"
version = "0.1.0"
description = "Pramaan Payment Protection API Service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "firebase-admin>=6.6.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-pubsub>=2.26.0",
    "google-cloud-kms>=3.1.0",
    "google-cloud-bigquery>=3.27.0",
    "cryptography>=43.0.0",
    "pyasn1>=0.6.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "cel-python>=0.5.0",
    "pyyaml>=6.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

# Only the app package is installed. migrations/, scripts/ and tests/ sit beside it
# and must not be picked up as top-level packages by `pip install .`.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
